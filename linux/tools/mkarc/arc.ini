[External compressor:precomp]
datafile = arcdata.tmp
packedfile = arcdata.pcf
packcmd = precomp -cn arcdata.tmp
unpackcmd = precomp -r arcdata.pcf

[External compressor:srep]
datafile = arcdata.tmp
packedfile = arcpacked.tmp
packcmd = srep arcdata.tmp arcpacked.tmp
unpackcmd = srep -d arcpacked.tmp arcdata.tmp
