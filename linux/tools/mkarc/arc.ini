[External compressor:precomp]
header = 0
packcmd = precomp -cn $$arcdatafile$$.tmp $$arcpackedfile$$.tmp
unpackcmd = precomp -r $$arcpackedfile$$.tmp $$arcdatafile$$.tmp
datafile = $$arcdatafile$$.tmp
packedfile = $$arcpackedfile$$.tmp

[External compressor:srep]
header = 0
packcmd = srep $$arcdatafile$$.tmp $$arcpackedfile$$.tmp
unpackcmd = srep -d $$arcpackedfile$$.tmp $$arcdatafile$$.tmp
datafile = $$arcdatafile$$.tmp
packedfile = $$arcpackedfile$$.tmp

[External compressor:xdelta3]
header = 0
packcmd = xdelta3 -e -s $$arcdatafile$$.tmp $$arcdatafile$$.tmp $$arcpackedfile$$.tmp
unpackcmd = xdelta3 -d -s $$arcdatafile$$.tmp $$arcpackedfile$$.tmp $$arcdatafile$$.tmp
datafile = $$arcdatafile$$.tmp
packedfile = $$arcpackedfile$$.tmp
